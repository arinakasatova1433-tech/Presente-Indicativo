// ---------- НОРМАЛИЗАЦИЯ ДЛЯ ГИБКОЙ ПРОВЕРКИ ----------
function normalizeAnswer(str) {
    if (!str) return '';
    // Приводим к нижнему регистру
    let s = str.toLowerCase();
    // Убираем ударения (заменяем на обычные буквы)
    const accents = {
        'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u',
        'à': 'a', 'è': 'e', 'ì': 'i', 'ò': 'o', 'ù': 'u',
        'ä': 'a', 'ë': 'e', 'ï': 'i', 'ö': 'o', 'ü': 'u'
    };
    s = s.replace(/[áàäéèëíìïóòöúùü]/g, function(match) {
        return accents[match] || match;
    });
    // Удаляем вопросительные и восклицательные знаки
    s = s.replace(/[¿?¡!.,;:]/g, '');
    // Удаляем лишние пробелы
    s = s.replace(/\s+/g, ' ').trim();
    return s;
}

// Функция проверки, считается ли ответ правильным
function isAnswerAccepted(userAnswer, correctAnswer) {
    const userNorm = normalizeAnswer(userAnswer);
    const correctNorm = normalizeAnswer(correctAnswer);
    // Если полностью совпадает после нормализации – ок
    if (userNorm === correctNorm) return true;
    // Если пользовательский ответ содержит правильный как подстроку – ок
    // (это позволяет добавлять местоимения, артикли, etc.)
    if (userNorm.includes(correctNorm)) return true;
    // Если правильный ответ содержит пользовательский – ок
    // (это позволяет писать сокращённо, но только если это имеет смысл)
    if (correctNorm.includes(userNorm) && userNorm.length > 0) return true;
    return false;
}

        questionText: questionText,
        optionsDiv: optionsDiv,
        feedbackDiv: feedbackDiv,
        checkBtn: checkBtn,
        nextBtn: nextBtn,
        finishBtn: finishBtn,
        resultDiv: resultDiv,
        scoreSpan: scoreSpan,
        progressSpan: progressSpan,
        finalScore: bigScore
    };

    loadQuestion(tabId);
    checkBtn.addEventListener('click', () => checkAnswer(tabId));
    nextBtn.addEventListener('click', () => nextQuestion(tabId));
    finishBtn.addEventListener('click', () => finishTopic(tabId));
    optionsDiv.addEventListener('change', () => {
        const state = states[tabId];
        if (!state.answered) {
            document.querySelectorAll(`#opts-${tabId} label`).forEach(l => {
                l.style.borderColor = '#dde3ea';
                l.style.background = 'white';
            });
        }
    });
}

function loadQuestion(tabId) {
    const state = states[tabId];
    if (!state || state.finished) return;
    const q = state.questions[state.currentIndex];
    state.questionText.textContent = q.q;
    state.optionsDiv.innerHTML = '';
    if (q.type === 'choice') {
        q.opts.forEach((opt, i) => {
            const label = document.createElement('label');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q-${tabId}`;
            radio.value = i;
            label.appendChild(radio);
            label.appendChild(document.createTextNode(' ' + opt));
            state.optionsDiv.appendChild(label);
        });
    } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'input-answer';
        input.id = `input-${tabId}`;
        input.placeholder = 'Введите ответ...';
        state.optionsDiv.appendChild(input);
    }
    state.feedbackDiv.className = 'feedback';
    state.feedbackDiv.innerHTML = '';
    state.feedbackDiv.style.display = 'none';
    state.checkBtn.disabled = false;
    state.nextBtn.disabled = true;
    state.answered = false;
    state.progressSpan.textContent = `Вопрос ${state.currentIndex + 1} из ${state.questions.length}`;
    updateScore(tabId);
    if (state.correctCount >= 15 && !state.finished) {
        state.finishBtn.style.display = 'inline-block';
    } else {
        state.finishBtn.style.display = 'none';
    }
}

function updateScore(tabId) {
    const state = states[tabId];
    if (!state) return;
    state.scoreSpan.textContent = `✅ ${state.correctCount} / ${state.questions.length}`;
    if (state.correctCount >= 15 && !state.finished) {
        state.finishBtn.style.display = 'inline-block';
    }
}

function checkAnswer(tabId) {
    const state = states[tabId];
    if (!state || state.answered || state.finished) return;
    const q = state.questions[state.currentIndex];
    let userAnswer = null;
    let isCorrect = false;
    let correctDisplay = '';

    if (q.type === 'choice') {
        const selected = document.querySelector(`input[name="q-${tabId}"]:checked`);
        if (!selected) {
            state.feedbackDiv.style.display = 'block';
            state.feedbackDiv.className = 'feedback wrong';
            state.feedbackDiv.innerHTML = '⚠️ Выберите вариант ответа.';
            return;
        }
        const selectedIndex = parseInt(selected.value);
        isCorrect = (selectedIndex === q.correct);
        userAnswer = q.opts[selectedIndex];
        correctDisplay = q.opts[q.correct];
        // Подсветка
        const labels = state.optionsDiv.querySelectorAll('label');
        labels.forEach((label, idx) => {
            if (idx === q.correct) {
                label.style.borderColor = '#28a745';
                label.style.background = '#d4edda';
            } else if (idx === selectedIndex && !isCorrect) {
                label.style.borderColor = '#dc3545';
                label.style.background = '#f8d7da';
            }
        });
    } else {
        // ---- ПИСЬМЕННЫЙ ОТВЕТ ----
        const input = document.getElementById(`input-${tabId}`);
        if (!input) return;
        userAnswer = input.value.trim();
        // Используем гибкую проверку
        isCorrect = isAnswerAccepted(userAnswer, q.correct);
        correctDisplay = q.correct;
    }

    state.feedbackDiv.style.display = 'block';
    if (isCorrect) {
        state.feedbackDiv.className = 'feedback correct';
        state.correctCount++;
        updateScore(tabId);
    } else {
        state.feedbackDiv.className = 'feedback wrong';
    }
    let html = isCorrect ? '✅ Правильно!' : '❌ Неправильно.';
    if (q.expl) {
        html += `<div class="explanation">${q.expl}</div>`;
    }
    if (!isCorrect) {
        html += `<div style="margin-top:6px;">Правильный ответ: <strong>${correctDisplay}</strong></div>`;
    }
    state.feedbackDiv.innerHTML = html;

    state.checkBtn.disabled = true;
    state.nextBtn.disabled = false;
    state.answered = true;
    if (state.correctCount >= 15 && !state.finished) {
        state.finishBtn.style.display = 'inline-block';
    }
}

function nextQuestion(tabId) {
    const state = states[tabId];
    if (!state || !state.answered || state.finished) return;
    if (state.currentIndex + 1 < state.questions.length) {
        state.currentIndex++;
        loadQuestion(tabId);
    } else {
        finishTopic(tabId);
    }
}

function finishTopic(tabId) {
    const state = states[tabId];
    if (!state) return;
    state.finished = true;
    state.wrapper.querySelector('.question-box').style.display = 'none';
    state.resultDiv.classList.remove('hidden');
    state.finalScore.textContent = state.correctCount;
    state.checkBtn.disabled = true;
    state.nextBtn.disabled = true;
    state.finishBtn.style.display = 'none';
}

function restartTab(tabId) {
    const state = states[tabId];
    if (!state) return;
    state.currentIndex = 0;
    state.correctCount = 0;
    state.answered = false;
    state.finished = false;
    state.wrapper.querySelector('.question-box').style.display = 'block';
    state.resultDiv.classList.add('hidden');
    state.checkBtn.disabled = false;
    state.nextBtn.disabled = true;
    state.finishBtn.style.display = 'none';
    updateScore(tabId);
    loadQuestion(tabId);
    document.querySelectorAll(`#opts-${tabId} label`).forEach(l => {
        l.style.borderColor = '#dde3ea';
        l.style.background = 'white';
    });
}

// Переключение вкладок
tabBtns.forEach(btn => {
    btn.addEventListener('click', function() {
        const tabId = this.dataset.tab;
        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById(tabId).classList.add('active');
        if (!states[tabId]) {
            initTab(tabId);
        }
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const activeTab = document.querySelector('.tab-btn.active');
    if (activeTab) {
        const tabId = activeTab.dataset.tab;
        initTab(tabId);
    }
});
</script>
</body>
</html>
