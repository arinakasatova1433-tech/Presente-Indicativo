<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f0f4f8">
    <title>Паутина спряжений настоящего времени</title>
    <style>
        /* --- Общие стили --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: #f0f4f8;
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Заголовок --- */
        .game-title {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
        }

        .game-title h1 {
            margin: 0;
            font-size: clamp(16px, 4.5vw, 32px);
            color: #1a1a1a;
            font-family: 'Georgia', serif;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
            line-height: 1.3;
            padding: 0 8px;
        }

        .game-title h1 span {
            font-size: 0.85em;
            vertical-align: middle;
        }

        /* --- Контейнер игры --- */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 950px;
        }

        /* --- Игровое поле --- */
        #game-board {
            position: relative;
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            place-items: center;
            min-height: 850px;
        }

        /* --- Фон-паутина (SVG) --- */
        .web-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* --- Паучки --- */
        .spider {
            position: absolute;
            font-size: clamp(20px, 3vw, 40px);
            z-index: 2;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            animation: crawl 3s infinite alternate ease-in-out;
        }
        @keyframes crawl {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(6deg); }
        }

        .spider-hanging {
            animation: swing 4s infinite ease-in-out;
            transform-origin: top center;
        }
        @keyframes swing {
            0% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
            100% { transform: rotate(-5deg); }
        }

        /* --- Группы глаголов --- */
        .verb-group {
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .verb-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin-bottom: 2px;
        }

        .verb-title {
            margin: 0;
            font-size: clamp(15px, 2.5vw, 22px);
            font-weight: 800;
            color: #333;
            text-shadow: 0 2px 4px rgba(255,255,255,0.9);
            background: rgba(255, 255, 255, 0.95);
            padding: 3px 14px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            white-space: nowrap;
        }

        .trans-input {
            width: 130px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            background: rgba(255, 255, 255, 0.95);
            font-family: inherit;
        }

        .trans-input:focus {
            border-color: #4CAF50;
            background: #fff;
        }

        /* --- Сетка 2x3 внутри группы --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
        }

        /* --- Квадраты с инпутами --- */
        .input-box {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .input-box input {
            width: 95%;
            height: 95%;
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            font-family: inherit;
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 600;
            text-shadow: none;
        }

        .input-box input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 8px;
        }

        /* --- Цвета квадратов --- */
        .color-brown { background-color: #8B4545; }
        .color-purple { background-color: #B35A9C; }
        .color-lightblue { background-color: #7BC6F0; }
        .color-teal { background-color: #4BAFAF; }
        .color-lightgreen { background-color: #B8E986; }
        .color-pink { background-color: #FF6B8B; }

        /* --- Подсветка проверки --- */
        .correct {
            border-color: #00E676 !important;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.6), inset 0 0 10px rgba(0, 230, 118, 0.2);
        }
        .incorrect {
            border-color: #FF1744 !important;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.6), inset 0 0 10px rgba(255, 23, 68, 0.2);
        }
        .trans-input.correct { border-color: #00E676; box-shadow: 0 0 10px rgba(0, 230, 118, 0.4); }
        .trans-input.incorrect { border-color: #FF1744; box-shadow: 0 0 10px rgba(255, 23, 68, 0.4); }

        /* --- Кнопки --- */
        .controls {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            padding: 0 8px;
        }

        .btn {
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: #222222;
            color: #cccccc;
            border: 2px dashed #666666;
            box-shadow: 0 0 10px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.8);
            font-family: inherit;
            flex: 1 1 auto;
            min-width: 110px;
            max-width: 220px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-check { border-color: #4CAF50; color: #a5d6a7; }
        .btn-reset { border-color: #F44336; color: #ef9a9a; }
        .btn-next { border-color: #2196F3; color: #90caf9; }

        /* --- Позиционирование групп в сетке 3x3 --- */
        #group-0 { grid-column: 2; grid-row: 1; }
        #group-1 { grid-column: 3; grid-row: 1; }
        #group-2 { grid-column: 1; grid-row: 2; }
        #group-3 { grid-column: 3; grid-row: 2; }
        #group-4 { grid-column: 1; grid-row: 3; }
        #group-5 { grid-column: 3; grid-row: 3; }

        /* ================================================
           ПЛАНШЕТЫ (600px – 900px)
           ================================================ */
        @media (max-width: 900px) {
            #game-board {
                padding: 15px;
                gap: 15px;
                min-height: 750px;
            }
            .input-box {
                width: 60px;
                height: 60px;
            }
            .input-box input {
                font-size: 13px;
            }
            .input-box input::placeholder {
                font-size: 10px;
            }
            .verb-title {
                font-size: 15px;
                padding: 2px 10px;
            }
            .trans-input {
                width: 110px;
                font-size: 13px;
            }
            .spider {
                font-size: 24px;
            }
        }

        /* ================================================
           ТЕЛЕФОНЫ (до 600px) — вертикальный стек
           ================================================ */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .game-title h1 {
                font-size: 17px;
                line-height: 1.35;
            }

            #game-board {
                display: flex;
                flex-direction: column;
                padding: 12px;
                gap: 12px;
                border-radius: 16px;
                min-height: auto;
                overflow: visible;
            }

            /* Скрываем SVG-паутину и всех паучков, кроме одного */
            .web-bg { display: none; }
            .spider { display: none; }
            .spider-mobile {
                display: block;
                position: absolute;
                font-size: 22px;
                top: 8px;
                right: 12px;
                opacity: 0.7;
                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
                animation: crawl 3s infinite alternate ease-in-out;
            }

            /* Каждая группа глаголов — карточка */
            .verb-group {
                width: 100%;
                background: linear-gradient(135deg, #fafbfc 0%, #f4f6f8 100%);
                border-radius: 14px;
                padding: 12px 10px;
                gap: 10px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.06);
                border: 1px solid #eaeef2;
            }

            /* Сбрасываем grid-позиционирование */
            #group-0, #group-1, #group-2,
            #group-3, #group-4, #group-5 {
                grid-column: auto;
                grid-row: auto;
            }

            .verb-header {
                width: 100%;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }

            .verb-title {
                font-size: 18px;
                padding: 4px 14px;
                background: #ffffff;
                box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            }

            .trans-input {
                width: 140px;
                font-size: 14px;
                padding: 8px 10px;
                background: #ffffff;
            }

            /* Сетка форм — 3 колонки x 2 строки на телефоне,
               чтобы поля были крупнее и удобнее */
            .grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 8px;
                width: 100%;
                max-width: 340px;
            }

            .input-box {
                width: 100%;
                height: auto;
                aspect-ratio: 1 / 1;
                min-height: 52px;
                border-radius: 10px;
            }

            .input-box input {
                font-size: 14px;
            }

            .input-box input::placeholder {
                font-size: 10px;
            }

            /* Кнопки на всю ширину */
            .controls {
                margin-top: 12px;
                flex-direction: column;
                gap: 8px;
                padding: 0 4px;
            }

            .btn {
                width: 100%;
                max-width: 100%;
                padding: 16px 20px;
                font-size: 15px;
                flex: 1 1 auto;
            }
        }

        /* Скрываем мобильного паучка на десктопе */
        .spider-mobile { display: none; }

        /* Очень маленькие телефоны */
        @media (max-width: 380px) {
            .verb-title {
                font-size: 16px;
            }
            .grid {
                max-width: 290px;
                gap: 6px;
            }
            .input-box {
                min-height: 46px;
            }
            .input-box input {
                font-size: 13px;
            }
            .input-box input::placeholder {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">

<script>
    // БАЗА ДАННЫХ: 79 уникальных глаголов (Presente de indicativo)
    const verbDatabase = [
        { inf: "leer", trans: "читать", forms: ["leo", "lees", "lee", "leemos", "leéis", "leen"] },
        { inf: "escribir", trans: "писать", forms: ["escribo", "escribes", "escribe", "escribimos", "escribís", "escriben"] },
        { inf: "aprender", trans: "учиться", forms: ["aprendo", "aprendes", "aprende", "aprendemos", "aprendéis", "aprenden"] },

    let currentVerbs = [];

    // Инициализация игры
    function initGame() {
        const shuffled = [...verbDatabase].sort(() => Math.random() - 0.5);
        currentVerbs = shuffled.slice(0, 6);

        for (let i = 0; i < 6; i++) {
            const group = document.getElementById(`group-${i}`);
            const verb = currentVerbs[i];

            group.querySelector('.verb-title').textContent = verb.inf;

            const transInput = group.querySelector('.trans-input');
            transInput.value = '';
            transInput.dataset.answer = verb.trans;
            transInput.classList.remove('correct', 'incorrect');

            const inputs = group.querySelectorAll('.grid input');
            inputs.forEach((input, index) => {
                input.value = '';
                input.dataset.answer = verb.forms[index];
                input.parentElement.classList.remove('correct', 'incorrect');

                if (verb.inf === 'gustar') {
                    const gustarPlaceholders = ['me', 'te', 'le', 'nos', 'os', 'les'];
                    input.placeholder = gustarPlaceholders[index];
                } else {
                    const defaultPlaceholders = ['yo', 'tú', 'él', 'nosotros', 'vosotros', 'ellos'];
                    input.placeholder = defaultPlaceholders[index];
                }
            });
        }

        // Скроллим наверх после смены глаголов
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Проверка ответов
    function checkAnswers() {
        let correctCount = 0;
        let totalCount = 0;

        for (let i = 0; i < 6; i++) {
            const group = document.getElementById(`group-${i}`);
            const verb = currentVerbs[i];

            const transInput = group.querySelector('.trans-input');
            const userTrans = transInput.value.trim().toLowerCase();
            const correctTrans = verb.trans.toLowerCase();

            transInput.classList.remove('correct', 'incorrect');

            if (userTrans === correctTrans || correctTrans.includes(userTrans) && userTrans.length > 2 || userTrans.includes(correctTrans)) {
                transInput.classList.add('correct');
                correctCount++;
            } else {
                transInput.classList.add('incorrect');
            }
            totalCount++;

            const inputs = group.querySelectorAll('.grid input');
            inputs.forEach((input, index) => {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = verb.forms[index].toLowerCase();
                const parent = input.parentElement;

                parent.classList.remove('correct', 'incorrect');

                const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

                if (normalize(userAnswer) === normalize(correctAnswer)) {
                    parent.classList.add('correct');
                    correctCount++;
                } else {
                    parent.classList.add('incorrect');
                }
                totalCount++;
            });
        }

        setTimeout(() => {
            if (correctCount === totalCount) {
                alert(`🎉 Отлично! Все ${totalCount} ответов верны!`);
            } else {
                alert(`✅ Правильно: ${correctCount} из ${totalCount}.\nПопробуй еще раз!`);
            }
        }, 100);
    }

    // Сброс
    function resetAnswers() {
        document.querySelectorAll('input').forEach(input => {
            input.value = '';
            input.classList.remove('correct', 'incorrect');
            if (input.parentElement.classList.contains('input-box')) {
                input.parentElement.classList.remove('correct', 'incorrect');
            }
        });
    }
